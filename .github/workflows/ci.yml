name: NexPOS Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Pipeline armado con los workflows estándar de miguelortiz13/github-workflows.
permissions:
  contents: read

jobs:
  security-scan:
    name: Security baseline
    uses: miguelortiz13/github-workflows/.github/workflows/security-baseline.yml@v0.2.0
    permissions:
      contents: read
      pull-requests: write

  lint-and-build:
    name: Lint & Production Build
    needs: security-scan
    uses: miguelortiz13/github-workflows/.github/workflows/build-node.yml@v0.2.0
    with:
      node-version: "22"
      scripts: lint build
      artifact-path: dist

  docker-publish:
    name: Imagen (build, Trivy y GHCR)
    needs: lint-and-build
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.2.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: nexpos-frontend
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  sign:
    name: Firma y SBOM (Cosign)
    needs: docker-publish
    if: needs.docker-publish.outputs.ref != ''
    uses: miguelortiz13/github-workflows/.github/workflows/container-sign.yml@v0.2.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-ref: ${{ needs.docker-publish.outputs.ref }}
