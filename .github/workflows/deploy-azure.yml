name: Deploy Azure Static Web App

# Publica el frontend en Azure Static Web Apps (Free) con el workflow estándar
# de miguelortiz13/ci-workflows: OIDC y token de despliegue pedido en el momento.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    uses: miguelortiz13/ci-workflows/.github/workflows/deploy-static-web-app.yml@v0.1.1
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      app-name: ${{ vars.NEXPOS_SWA_NAME }}
      resource-group: ${{ vars.NEXPOS_RESOURCE_GROUP }}
      build-env: |
        VITE_API_URL=${{ vars.NEXPOS_API_URL }}
      verify-paths: / /login /productos
